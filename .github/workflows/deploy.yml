name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || '22' }}
        script: |
          # 1. Ir a la carpeta del proyecto en el servidor
          cd ${{ secrets.SERVER_PROJECT_PATH }}
          
          # 2. Poner la aplicación en modo mantenimiento
          php artisan down --refresh=15 --secret="deploying-sientia" || true
          
          # 3. Traer los últimos cambios de main
          git pull origin main
          
          # 4. Instalar dependencias de PHP (sin dev para producción)
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
          
          # 5. Instalar dependencias de Node.js y compilar assets
          npm ci
          npm run build
          
          # 6. Ejecutar migraciones
          php artisan migrate --force
          
          # 7. Limpiar y reconstruir caché (Config, Rutas, Vistas)
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          rm -f bootstrap/cache/livewire-components.php
          
          # 8. Fix for Nginx intercepting Livewire JS
          mkdir -p public/livewire
          cp vendor/livewire/livewire/dist/livewire.js public/livewire/livewire.js || true
          cp vendor/livewire/livewire/dist/livewire.min.js public/livewire/livewire.min.js || true
          cp vendor/livewire/livewire/dist/livewire.min.js.map public/livewire/livewire.min.js.map || true
          
          # 9. (Opcional) Generar/Actualizar SBOM en producción
          composer sbom:generate || true
          
          # 9. Quitar el modo mantenimiento
          php artisan up
